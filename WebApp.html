<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>CRM Agencia de Viajes</title>
<style>
*{font-family:'Plus Jakarta Sans',system-ui,sans-serif;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0f172a;min-height:100vh;overflow-x:hidden;}
/* Secciones */
.seccion{display:none;min-height:calc(100vh - 118px);padding-bottom:8px;}
.seccion.activa{display:block;}
/* Header */
.app-header{background:#0a1120;border-bottom:1px solid #1e293b;padding:.7rem 1rem;
  position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:.65rem;height:56px;}
.hdr-icon{width:34px;height:34px;border-radius:.65rem;background:linear-gradient(135deg,#1e40af,#3b82f6);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.hdr-title{flex:1;min-width:0;}
.hdr-title h1{color:#f1f5f9;font-size:.95rem;font-weight:800;margin:0;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-title p{color:#475569;font-size:.7rem;margin:0;}
.refresh-btn{background:none;border:none;color:#3b82f6;font-size:1.3rem;cursor:pointer;padding:.2rem;}
/* Contenido */
#spa-contenido{margin-top:56px;margin-bottom:62px;overflow-y:auto;}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0a1120;
  border-top:1px solid #1e293b;display:flex;z-index:100;height:62px;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.12rem;cursor:pointer;background:none;border:none;padding:.3rem .1rem;position:relative;}
.bnav-btn .bi{font-size:1.2rem;line-height:1;}
.bnav-btn .bt{font-size:.58rem;font-weight:700;color:#475569;transition:color .15s;}
.bnav-btn.active .bt{color:#3b82f6;}
.bnav-btn.active::after{content:'';position:absolute;top:0;left:15%;right:15%;
  height:2px;background:#3b82f6;border-radius:0 0 3px 3px;}
/* Spinner */
#spa-loading{display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:60vh;gap:.75rem;}
.spinner-lg{width:36px;height:36px;border:4px solid rgba(59,130,246,.15);
  border-top-color:#3b82f6;border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header fijo -->
<div class="app-header">
  <div class="hdr-icon">✈️</div>
  <div class="hdr-title">
    <h1 id="hdr-title">CRM Agencia de Viajes</h1>
    <p  id="hdr-sub">Panel principal</p>
  </div>
  <button class="refresh-btn" onclick="refrescarSeccion()" title="Actualizar">⟳</button>
</div>

<!-- Área de contenido -->
<div id="spa-contenido">

  <div id="spa-loading">
    <div class="spinner-lg"></div>
    <div style="color:#475569;font-size:.82rem;">Iniciando CRM...</div>
  </div>

  <!-- HOME -->
  <div class="seccion" id="sec-home">
    <?!= include('SeccionHome') ?>
  </div>

  <!-- BUSCAR -->
  <div class="seccion" id="sec-buscar">
    <?!= include('SeccionBuscar') ?>
  </div>

  <!-- KANBAN -->
  <div class="seccion" id="sec-kanban">
    <?!= include('SeccionKanban') ?>
  </div>

  <!-- PAGO -->
  <div class="seccion" id="sec-pago">
    <?!= include('SeccionPago') ?>
  </div>

  <!-- CLIENTE -->
  <div class="seccion" id="sec-cliente">
    <?!= include('SeccionCliente') ?>
  </div>

  <!-- DESTINO -->
  <div class="seccion" id="sec-destino">
    <?!= include('SeccionDestino') ?>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bnav-btn" id="nav-home"    onclick="navegarA('home')">
    <span class="bi">🏠</span><span class="bt">Inicio</span>
  </button>
  <button class="bnav-btn" id="nav-buscar"  onclick="navegarA('buscar')">
    <span class="bi">🔍</span><span class="bt">Buscar</span>
  </button>
  <button class="bnav-btn" id="nav-kanban"  onclick="navegarA('kanban')">
    <span class="bi">📊</span><span class="bt">Kanban</span>
  </button>
  <button class="bnav-btn" id="nav-pago"    onclick="navegarA('pago')">
    <span class="bi">💳</span><span class="bt">Pago</span>
  </button>
  <button class="bnav-btn" id="nav-cliente" onclick="navegarA('cliente')">
    <span class="bi">➕</span><span class="bt">Cliente</span>
  </button>
</nav>

<script>
var SECCIONES = {
  home:    {titulo:'CRM Agencia de Viajes', sub:'Panel principal',        init:'shCargarDatos'},
  buscar:  {titulo:'Buscar Cliente',         sub:'Nombre, cédula o celular',init:null},
  kanban:  {titulo:'Tablero Kanban',         sub:'Gestión de reservas',   init:'skCargar'},
  pago:    {titulo:'Registrar Pago',         sub:'Abonos y comprobantes', init:null},
  cliente: {titulo:'Añadir Cliente',         sub:'Verificar o crear',     init:null},
  destino: {titulo:'Destinos',               sub:'Rutas y viajes',        init:'sdCargar'}
};

var seccionActual = null;

function navegarA(seccion) {
  if (seccionActual === seccion) return;
  seccionActual = seccion;
  var cfg = SECCIONES[seccion] || SECCIONES.home;
  document.getElementById('hdr-title').textContent = cfg.titulo;
  document.getElementById('hdr-sub').textContent   = cfg.sub;
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('active');});
  var nb = document.getElementById('nav-' + seccion);
  if (nb) nb.classList.add('active');
  document.querySelectorAll('.seccion').forEach(function(s){s.classList.remove('activa');});
  var sec = document.getElementById('sec-' + seccion);
  if (sec) sec.classList.add('activa');
  document.getElementById('spa-contenido').scrollTop = 0;
  if (cfg.init && typeof window[cfg.init] === 'function') {
    window[cfg.init]();
  }
}

function refrescarSeccion() {
  if (!seccionActual) return;
  var cfg = SECCIONES[seccionActual];
  if (cfg && cfg.init && typeof window[cfg.init] === 'function') {
    window[cfg.init]();
  }
}

window.irA = function(seccion) { navegarA(seccion); };

// Ocultar spinner e iniciar
document.getElementById('spa-loading').style.display = 'none';
navegarA('home');
</script>
</body>
</html>
