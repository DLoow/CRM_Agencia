<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family:'Plus Jakarta Sans',sans-serif; box-sizing:border-box; }
  body { background:#f0f4ff; margin:0; padding:.75rem; }
  .stat { background:#fff; border-radius:.9rem; padding:.75rem; box-shadow:0 1px 5px rgba(0,0,0,.07); transition:transform .15s; }
  .stat:active { transform:scale(.97); }
  .action-btn { display:flex; flex-direction:column; align-items:center; gap:.35rem; padding:.7rem .4rem;
                border-radius:.9rem; cursor:pointer; font-size:.7rem; font-weight:700;
                color:#1e293b; text-align:center; border:none; width:100%; }
  .etapa-pill { font-size:.6rem; font-weight:700; padding:2px 7px; border-radius:9999px; }
  .res-row { background:#fff; border-radius:.8rem; padding:.7rem; margin-bottom:.45rem;
             box-shadow:0 1px 4px rgba(0,0,0,.06); border-left:3px solid #e2e8f0; }
  .res-row.real { border-left-color:#3b82f6; }
  .res-row.seg  { border-left-color:#94a3b8; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid #e2e8f0;
             border-top-color:#3b82f6; border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to{transform:rotate(360deg);} }
</style>
</head>
<body>

<!-- HEADER -->
<div class="flex items-center gap-2 mb-3">
  <div style="background:linear-gradient(135deg,#1e40af,#3b82f6);width:36px;height:36px;border-radius:.75rem;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;">✈️</div>
  <div class="flex-1">
    <div class="text-sm font-extrabold text-gray-800 leading-tight">CRM Agencia de Viajes</div>
    <div class="text-xs text-gray-400">Panel de control</div>
  </div>
  <button onclick="cargarDatos()" class="text-blue-500 text-lg font-bold" title="Actualizar">⟳</button>
</div>

<!-- STATS -->
<div id="stats" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem;">
  <div class="stat" style="display:flex;align-items:center;justify-content:center;min-height:56px;">
    <div class="spinner"></div>
  </div>
  <div class="stat" style="display:flex;align-items:center;justify-content:center;min-height:56px;">
    <div class="spinner"></div>
  </div>
  <div class="stat" style="display:flex;align-items:center;justify-content:center;min-height:56px;">
    <div class="spinner"></div>
  </div>
  <div class="stat" style="display:flex;align-items:center;justify-content:center;min-height:56px;">
    <div class="spinner"></div>
  </div>
</div>

<!-- ACCIONES -->
<div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Acciones rápidas</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem;">
  <button class="action-btn" style="background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;"
    onclick="google.script.run.abrirFormularioCliente()">
    <span style="font-size:1.3rem;">➕</span>Añadir Cliente
  </button>
  <button class="action-btn" style="background:#eff6ff;color:#1d4ed8;border:1.5px solid #bfdbfe;"
    onclick="google.script.run.abrirBuscarCliente()">
    <span style="font-size:1.3rem;">🔍</span>Buscar Cliente
  </button>
  <button class="action-btn" style="background:linear-gradient(135deg,#065f46,#10b981);color:#fff;"
    onclick="google.script.run.abrirKanban()">
    <span style="font-size:1.3rem;">📊</span>Tablero Kanban
  </button>
  <button class="action-btn" style="background:linear-gradient(135deg,#92400e,#f59e0b);color:#fff;"
    onclick="google.script.run.abrirFormularioPago()">
    <span style="font-size:1.3rem;">💳</span>Registrar Pago
  </button>
  <button class="action-btn" style="background:#f5f3ff;color:#6d28d9;border:1.5px solid #ddd6fe;"
    onclick="google.script.run.abrirFormularioDestino()">
    <span style="font-size:1.3rem;">🗺️</span>Destinos
  </button>
  <button class="action-btn" style="background:#f8fafc;color:#475569;border:1.5px solid #e2e8f0;"
    onclick="cargarDatos()">
    <span style="font-size:1.3rem;">🔄</span>Actualizar
  </button>
</div>

<!-- ÚLTIMAS TARJETAS -->
<div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Últimas actividades</div>
<div id="ultimas">
  <div style="text-align:center;padding:1.5rem 0;">
    <div class="spinner" style="margin:0 auto;"></div>
  </div>
</div>

<script>
const ETAPA_COL = {
  'Nuevos Interesados':'background:#f1f5f9;color:#475569',
  'Contactados':'background:#eff6ff;color:#1d4ed8',
  'Cotización por Enviar':'background:#fefce8;color:#854d0e',
  'Cotización Enviada':'background:#f5f3ff;color:#6d28d9',
  'Seguimiento':'background:#fff7ed;color:#9a3412',
  'Separó Cupo':'background:#ecfeff;color:#0e7490',
  'Pago Completo':'background:#f0fdf4;color:#166534',
  'Viaje Realizado':'background:#ecfdf5;color:#065f46',
  'Posventa':'background:#fdf2f8;color:#9d174d'
};

function fmt(n){ return '$'+(Number(n)||0).toLocaleString('es-CO'); }

function cargarDatos(){
  google.script.run
    .withSuccessHandler(d=>{
      document.getElementById('stats').innerHTML = `
        <div class="stat">
          <div style="font-size:1.5rem;font-weight:800;color:#3b82f6;">${d.totalClientes}</div>
          <div style="font-size:.68rem;color:#6b7280;font-weight:600;">👤 Clientes</div>
        </div>
        <div class="stat">
          <div style="font-size:1.5rem;font-weight:800;color:#a78bfa;">${d.totalCotiz}</div>
          <div style="font-size:.68rem;color:#6b7280;font-weight:600;">📋 Cotizaciones</div>
        </div>
        <div class="stat">
          <div style="font-size:1.5rem;font-weight:800;color:#10b981;">${d.totalReservas}</div>
          <div style="font-size:.68rem;color:#6b7280;font-weight:600;">🎫 Reservas reales</div>
        </div>
        <div class="stat">
          <div style="font-size:1rem;font-weight:800;color:#f59e0b;">${fmt(d.totalRecaudado)}</div>
          <div style="font-size:.68rem;color:#6b7280;font-weight:600;">💰 Recaudado</div>
        </div>`;
    })
    .obtenerResumenGeneral();

  google.script.run
    .withSuccessHandler(rs=>{
      const c = document.getElementById('ultimas');
      if(!rs||!rs.length){
        c.innerHTML='<div style="color:#9ca3af;font-size:.75rem;text-align:center;padding:1rem;">Sin actividad aún</div>';
        return;
      }
      const ult = rs.slice().reverse().slice(0,10);
      c.innerHTML = ult.map(r=>{
        const esSeg = !r.esReservaReal;
        const pct   = r.totalPagar>0?Math.round((r.totalAbono/r.totalPagar)*100):0;
        const estilo = ETAPA_COL[r.etapa]||'background:#f1f5f9;color:#475569';
        return `
          <div class="res-row ${esSeg?'seg':'real'}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;">
              <div style="font-size:.8rem;font-weight:700;color:#1e293b;min-width:0;flex:1;">
                ${r.nombreCliente}
                <div style="font-size:.68rem;color:#6b7280;margin-top:.1rem;">${r.ruta||'<em>Sin destino</em>'}</div>
              </div>
              <span class="etapa-pill" style="${estilo};flex-shrink:0;">${r.etapa}</span>
            </div>
            ${!esSeg?`
              <div style="display:flex;justify-content:space-between;font-size:.68rem;margin-top:.35rem;">
                <span style="color:#6b7280;">${fmt(r.totalAbono)} / ${fmt(r.totalPagar)}</span>
                <span style="color:${Number(r.saldoPendiente)===0?'#059669':'#dc2626'};font-weight:700;">${fmt(r.saldoPendiente)}</span>
              </div>
              <div style="background:#e5e7eb;border-radius:9999px;height:3px;margin-top:4px;">
                <div style="background:${pct===100?'#10b981':'#3b82f6'};border-radius:9999px;height:3px;width:${pct}%;"></div>
              </div>` : ''}
          </div>`;
      }).join('');
    })
    .obtenerReservas();
}

cargarDatos();
</script>
</body>
</html>
